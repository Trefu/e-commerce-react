<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400" role="img" aria-label="Beyblade starter-achilles">
  <defs>
    <radialGradient id="outerG" cx="50%" cy="50%" r="50%"><stop offset="60%" stop-color="#ef4444"/><stop offset="100%" stop-color="#fb7185"/></radialGradient>
    <radialGradient id="energy" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#fb7185"/><stop offset="1" stop-color="#ef4444"/></radialGradient>
    <radialGradient id="boltG" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#fff7ed"/>
      <stop offset="0.5" stop-color="#fbbf24"/>
      <stop offset="1" stop-color="#92400e"/>
    </radialGradient>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#fecaca" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#fecaca" stop-opacity="0"/>
    </radialGradient>
    <filter id="ds" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="6"/>
      <feOffset dx="0" dy="8"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.55"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Halo -->
  <circle cx="200" cy="200" r="180" fill="url(#halo)"/>

  <!-- Drop-shadow base -->
  <ellipse cx="200" cy="222" rx="150" ry="22" fill="#000" opacity="0.35"/>

  <!-- Outer attack ring -->
  <circle cx="200" cy="200" r="150" fill="url(#outerG)" stroke="#0b1020" stroke-width="2"/>
  <!-- Decorative inner band -->
  <circle cx="200" cy="200" r="135" fill="none" stroke="#fecaca" stroke-opacity="0.5" stroke-width="2" stroke-dasharray="3 6"/>

  <!-- Three blades -->
  <g filter="url(#ds)">
    
      <g transform="rotate(0)">
        <path d="M 0 0 L -8 -52.25000000000001 L 0 -95 L 8 -52.25000000000001 L 20 -9.5 Z" fill="url(#outerG)" stroke="#0b1020" stroke-width="2" stroke-linejoin="round"/>
        <path d="M 0 0 L -8 -52.25000000000001 L 0 -95 L 8 -52.25000000000001 L 20 -9.5 Z" fill="none" stroke="#fecaca" stroke-opacity="0.6" stroke-width="1" stroke-linejoin="round"/>
      </g>
    
      <g transform="rotate(120)">
        <path d="M 0 0 L -8 -52.25000000000001 L 0 -95 L 8 -52.25000000000001 L 20 -9.5 Z" fill="url(#outerG)" stroke="#0b1020" stroke-width="2" stroke-linejoin="round"/>
        <path d="M 0 0 L -8 -52.25000000000001 L 0 -95 L 8 -52.25000000000001 L 20 -9.5 Z" fill="none" stroke="#fecaca" stroke-opacity="0.6" stroke-width="1" stroke-linejoin="round"/>
      </g>
    
      <g transform="rotate(240)">
        <path d="M 0 0 L -8 -52.25000000000001 L 0 -95 L 8 -52.25000000000001 L 20 -9.5 Z" fill="url(#outerG)" stroke="#0b1020" stroke-width="2" stroke-linejoin="round"/>
        <path d="M 0 0 L -8 -52.25000000000001 L 0 -95 L 8 -52.25000000000001 L 20 -9.5 Z" fill="none" stroke="#fecaca" stroke-opacity="0.6" stroke-width="1" stroke-linejoin="round"/>
      </g>
    
  </g>

  <!-- Energy layer disc -->
  <circle cx="200" cy="200" r="92" fill="url(#energy)" stroke="#0b1020" stroke-width="2"/>
  <circle cx="200" cy="200" r="78" fill="none" stroke="#fecaca" stroke-opacity="0.4" stroke-width="1.5"/>

  <!-- Inner socket -->
  <circle cx="200" cy="200" r="46" fill="#0b1020"/>
  <circle cx="200" cy="200" r="40" fill="url(#energy)" opacity="0.6"/>

  <!-- Bolt tip -->
  <circle cx="200" cy="200" r="26" fill="url(#boltG)" stroke="#0b1020" stroke-width="2"/>
  <!-- Bolt cross -->
  <g stroke="#0b1020" stroke-width="3" stroke-linecap="round">
    <line x1="186" y1="200" x2="214" y2="200"/>
    <line x1="200" y1="186" x2="200" y2="214"/>
  </g>

  <!-- Highlight -->
  <ellipse cx="168" cy="152" rx="34" ry="14" fill="white" opacity="0.18"/>
</svg>
